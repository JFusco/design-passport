<details id="native-qa-controls" open style="position:fixed;bottom:6px;right:6px;z-index:2147483647;width:calc(100% - 12px);max-height:44vh;overflow:auto;border:2px solid #7c3aed;border-radius:6px;background:#fff;color:#161616;font:12px system-ui;box-shadow:0 2px 12px #0003;padding:6px;box-sizing:border-box">
  <summary style="cursor:pointer;font-weight:700">Native QA controls — development only</summary>
  <div id="native-qa-identity" style="font-size:10px;overflow-wrap:anywhere;margin:6px 0"></div>
  <div style="display:flex;flex-wrap:wrap;gap:4px">
    <button id="native-qa-page">Current page / fresh session</button><button id="native-qa-changes">Recheck changes</button><button id="native-qa-full">Rescan captured audit fully</button><button id="native-qa-inspect">Inspect file and selection</button>
    <input id="native-qa-component" placeholder="Component ID" aria-label="QA component ID"><button id="native-qa-component-run">Recheck component</button>
    <input id="native-qa-issue" placeholder="Issue ID (empty: first issue)" aria-label="QA issue ID"><button id="native-qa-issue-run">Recheck issue</button>
    <input id="native-qa-node" placeholder="Editable node ID" aria-label="QA editable node ID">
    <select id="native-qa-field" aria-label="QA edit field"><option>name</option><option>visible</option><option>opacity</option><option>width</option><option>height</option><option>cornerRadius</option><option>strokeWeight</option></select>
    <input id="native-qa-value" placeholder="New value" aria-label="QA edit value"><button id="native-qa-edit">Edit allowlisted copy</button>
    <button id="native-qa-export">Export collected evidence JSON</button>
    <button id="native-qa-fixtures">Create fixture page in allowlisted copy</button>
  </div>
  <pre id="native-qa-status" style="white-space:pre-wrap;max-height:100px;overflow:auto;margin:6px 0;font-size:10px"></pre>
</details>
<script>
(() => {
  const metadata = /*__QA_CONFIG__*/;
  const byId = (suffix) => document.getElementById('native-qa-' + suffix);
  const evidence = { kind: 'design-passport-native-qa-evidence', schemaVersion: 1, metadata, sessionStartedAt: new Date().toISOString(), runs: [], events: [], inspections: [], edits: [], droppedEvents: 0, droppedRuns: 0 };
  let activeRun;
  let activeRecords = [];
  let nextCommand = 1;
  let lastReport;
  const measureCommands = new Set(['scan', 'refresh-audit', 'recheck-audit', 'audit-pages']);
  const beginRun = (request, timingOrigin, commandId) => ({ commandId, startedAt: new Date().toISOString(), start: performance.now(), request, timingOrigin, firstInSession: evidence.runs.length === 0 && evidence.droppedRuns === 0 });
  const retainRun = (run) => {
    delete run.start;
    run.number = evidence.runs.length + evidence.droppedRuns + 1;
    evidence.runs.push(run);
    activeRecords.push(run);
    if (evidence.runs.length > 30) { evidence.runs.shift(); evidence.droppedRuns += 1; }
  };
  const status = (message) => { byId('status').textContent = typeof message === 'string' ? message : JSON.stringify(message, null, 2); };
  const send = (message) => {
    if (measureCommands.has(message.type)) {
      if (activeRun) { status('A measured command is still active. Wait for handler completion, including saved-result maintenance.'); return; }
      activeRecords = [];
      activeRun = beginRun(message, 'qa-send', 'qa-request-' + nextCommand++);
    }
    parent.postMessage({ pluginMessage: measureCommands.has(message.type) ? { ...message, __nativeQaCommandId: activeRun.commandId } : message }, '*');
  };
  byId('identity').textContent = 'Production ' + metadata.source.revision.slice(0, 12) + (metadata.source.dirty ? ' + working changes' : '') + ' · code SHA ' + metadata.source.productionCodeSha256.slice(0, 16) + ' · harness ' + metadata.harnessSourceSha256.slice(0, 16) + '. Existing cache retained.';
  byId('page').onclick = () => send({ type: 'scan', request: { scope: 'page', refreshKnowledge: true } });
  byId('changes').onclick = () => send(metadata.capabilities.targetedRecheck ? { type: 'recheck-audit', request: { mode: 'changes' } } : { type: 'refresh-audit' });
  byId('full').onclick = () => send({ type: 'recheck-audit', request: { mode: 'full' } });
  byId('inspect').onclick = () => send({ type: 'qa-inspect', ...(byId('node').value.trim() ? { nodeIds: [byId('node').value.trim()] } : {}) });
  byId('fixtures').onclick = () => send({ type: 'qa-create-fixtures' });
  byId('component-run').onclick = () => send({ type: 'recheck-audit', request: { mode: 'component', componentId: byId('component').value.trim() } });
  byId('issue-run').onclick = () => send({ type: 'recheck-audit', request: { mode: 'issue', issueId: byId('issue').value.trim() || lastReport?.issueGroups?.[0]?.id || lastReport?.findings?.find((finding) => !['pass', 'not-applicable'].includes(finding.status))?.id || '' } });
  byId('edit').onclick = () => {
    const field = byId('field').value;
    const raw = byId('value').value;
    const value = field === 'name' ? raw : field === 'visible' ? (raw === 'true' ? true : raw === 'false' ? false : null) : Number(raw);
    send({ type: 'qa-edit', nodeId: byId('node').value.trim(), field, value });
  };
  byId('export').onclick = () => {
    const blob = new Blob([JSON.stringify({ ...evidence, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a'); anchor.href = url; anchor.download = 'design-passport-native-qa-' + new Date().toISOString().replaceAll(':', '-') + '.json'; anchor.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  if (!metadata.capabilities.targetedRecheck) {
    for (const id of ['full', 'component-run', 'issue-run']) { byId(id).disabled = true; byId(id).title = 'This baseline has no production command for targeted or forced-full rechecks'; }
  }
  window.addEventListener('message', (event) => {
    const message = event.data?.pluginMessage;
    if (!message?.type) return;
    const at = new Date().toISOString();
    if (message.type === 'qa-command-started') {
      if (!activeRun) { activeRecords = []; activeRun = beginRun(message.request, 'qa-handler-start', message.commandId); }
      if (activeRun.commandId === message.commandId) activeRun.handlerStartedAt = message.startedAt;
    }
    if (message.type === 'audit-started') {
      if (!activeRun) activeRun = beginRun(undefined, 'audit-started');
      activeRun.target = message.target;
      activeRun.auditStartedAt = at;
    }
    if (message.type === 'scan-result') {
      lastReport = message.report;
      const run = { ...(activeRun || { number: evidence.runs.length + evidence.droppedRuns + 1, startedAt: at, timingOrigin: 'unobserved' }), status: 'completed', completedAt: at, elapsedMs: activeRun ? performance.now() - activeRun.start : null, report: message.report, plans: message.plans, refresh: message.refresh, saveStatus: message.saveStatus, knowledge: message.knowledge };
      run.reportVisibleElapsedMs = run.elapsedMs;
      if (activeRun?.request?.type === 'audit-pages') run.timingOrigin += '-batch-cumulative';
      retainRun(run);
      status({ run: run.number, reportVisibleElapsedMs: run.reportVisibleElapsedMs, handlerCompleteElapsedMs: 'pending', findings: run.report.findings.length, grade: run.report.grade, refresh: run.refresh, saveStatus: run.saveStatus });
    }
    if (message.type === 'qa-inspection') { evidence.inspections.push({ at, ...message }); status(message); if (message.nodes?.[0]?.id) byId('node').value = message.nodes[0].id; }
    if (message.type === 'qa-edited') { evidence.edits.push({ at, ...message }); status(message); }
    if (message.type === 'qa-fixture-created') { evidence.inspections.push({ at, ...message }); status(message); }
    if (message.type === 'error' || message.type === 'qa-error' || message.type === 'scan-cancelled') {
      status(message);
      if (activeRun && !message.nonTerminal && (message.type !== 'qa-error' || message.commandId === activeRun.commandId)) {
        retainRun({ ...activeRun, status: message.type === 'scan-cancelled' ? 'cancelled' : 'failed', completedAt: at, elapsedMs: performance.now() - activeRun.start, failure: message });
      }
    }
    if (message.type === 'batch-complete' && activeRun) {
      retainRun({ ...activeRun, status: message.cancelled ? 'cancelled' : 'completed', completedAt: at, elapsedMs: performance.now() - activeRun.start, batch: message });
    }
    if (message.type === 'qa-command-complete' && activeRun?.commandId === message.commandId) {
      const handlerCompleteElapsedMs = performance.now() - activeRun.start;
      if (activeRecords.length === 0) retainRun({ ...activeRun, status: message.returned === 'rejected' ? 'failed' : 'completed-without-report', elapsedMs: handlerCompleteElapsedMs });
      for (const run of activeRecords) {
        run.handlerCompletedAt = at;
        run.handlerCompleteElapsedMs = handlerCompleteElapsedMs;
        run.handlerElapsedMs = message.handlerElapsedMs;
        run.handlerReturned = message.returned;
      }
      status({ commandId: activeRun.commandId, handlerCompleteElapsedMs, results: activeRecords.map((run) => ({ run: run.number, status: run.status, reportVisibleElapsedMs: run.reportVisibleElapsedMs })) });
      activeRun = undefined;
      activeRecords = [];
    }
    const compact = message.type === 'scan-result' ? { type: message.type, reportSnapshotHash: message.report.snapshotHash, refresh: message.refresh } : message.type === 'restored-audit' ? { type: message.type, auditId: message.audit.id, generatedAt: message.audit.report.generatedAt } : message;
    evidence.events.push({ at, message: compact });
    if (evidence.events.length > 5000) { evidence.events.shift(); evidence.droppedEvents += 1; }
  });
  status(metadata.coldSessionNote);
})();
</script>
